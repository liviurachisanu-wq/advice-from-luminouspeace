name: Validate cleaned offline v0.7.5 candidate
# Re-run after removing final old setup assertion
# Re-run after removing obsolete release assumptions from tests
on:
  push:
    branches:
      - review/v0.7.5-installation-reliability
    paths:
      - .github/workflows/build-cleanup-once.yml
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'liviurachisanu-wq/advice-from-luminouspeace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Build exact offline assets
        run: python scripts/build.py
      - name: Check all remaining tests, privacy and reproducibility
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --check
      - name: Commit regenerated assets to review branch
        run: |
          git add -- downloads index.html .github/skills/advice-from-luminouspeace/references
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email "$(printf '%s%s%s' '41898282+github-actions[bot]' '@' 'users.noreply.github.com')"
            git commit -m 'Regenerate clean offline v0.7.5 artifacts and source mirrors'
            git push origin HEAD:review/v0.7.5-installation-reliability
          fi
