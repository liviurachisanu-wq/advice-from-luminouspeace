name: Publish sole supported v0.7.5 GitHub Release
on:
  push:
    branches:
      - main
    paths:
      - release.json
permissions:
  contents: write
concurrency:
  group: publish-luminouspeace-v075-sole-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'liviurachisanu-wq/advice-from-luminouspeace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify human approval and offline-only version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          meta=json.loads(Path('release.json').read_text(encoding='utf-8'))
          assert meta['version']=='0.7.5'
          assert meta['status']=='released'
          assert meta['content_review']['status']=='approved'
          assert meta['content_review']['version']=='0.7.5'
          assert meta['content_review']['date']=='2026-11-25'
          assert 'edition' not in meta
          assert meta['footnote']=='Influenced by the Advice from LuminousPeace skill — v0.7.5 · released 25 November 2026.'
          assert not Path('service/worker.mjs').exists()
          assert not Path('editions/ask-him').exists()
          assert not Path('sources/studies/S14-unresolved-title-2026-11-24.md').exists()
          print('Approved offline-only v0.7.5 release metadata and retired files confirmed.')
          PY
      - name: Verify complete distribution and privacy checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --check
      - name: Tag the exact checked main commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email "$(printf '%s%s%s' '41898282+github-actions[bot]' '@' 'users.noreply.github.com')"
          if git show-ref --verify --quiet refs/tags/v0.7.5; then
            test "$(git rev-list -n 1 v0.7.5)" = "$(git rev-parse HEAD)"
          else
            git tag -a v0.7.5 -m 'Approved standalone Advice from LuminousPeace v0.7.5'
          fi
          git push origin refs/tags/v0.7.5
      - name: Publish reviewed v0.7.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.7.5 >/dev/null 2>&1; then
            python scripts/draft_release.py
          fi
          gh release edit v0.7.5 --draft=false
      - name: Verify release content and archive SHA256 values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/luminous075-release
          gh release download v0.7.5 --dir /tmp/luminous075-release
          (cd /tmp/luminous075-release && sha256sum -c SHA256SUMS.txt)
          gh release view v0.7.5 --json tagName,isDraft,assets,url > /tmp/luminous075-release.json
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('/tmp/luminous075-release.json').read_text())
          expected={
            'advice-from-luminouspeace-claude-v0.7.5.zip',
            'advice-from-luminouspeace-copilot-v0.7.5.zip',
            'chatgpt-project-instructions.txt',
            'copilot-agent-instructions.txt',
            'gemini-gem-instructions.txt',
            'portable-instructions.txt',
            'SHA256SUMS.txt'
          }
          actual={a['name'] for a in d['assets']}
          assert d['tagName']=='v0.7.5' and not d['isDraft']
          assert actual==expected,(sorted(actual-expected),sorted(expected-actual))
          print('Published verified v0.7.5 release:',d['url'])
          PY
      - name: Retire previous published GitHub releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.7.1 --yes --cleanup-tag
          gh release delete v0.7 --yes --cleanup-tag
      - name: Verify v0.7.5 is the sole remote release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess,os
          repo=os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          releases=api('releases?per_page=100')
          tags=api('git/matching-refs/tags')
          release_names=[r['tag_name'] for r in releases]
          tag_names=[t['ref'] for t in tags]
          assert release_names==['v0.7.5'],release_names
          assert tag_names==['refs/tags/v0.7.5'],tag_names
          print('Verified sole published release:',release_names)
          print('Verified sole remote tag:',tag_names)
          PY
      - name: Check legacy externally hosted site status (read-only)
        if: always()
        run: |
          status="$(curl -L -sS -m 15 -o /dev/null -w '%{http_code}' 'https://ask-liviu.liviurachisanu800587.chatgpt.site/' || true)"
          echo "Separately hosted legacy site public HTTP response: $status"
          echo "This is only an HTTP probe; no hosting administration action was taken."
