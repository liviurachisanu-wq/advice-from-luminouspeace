name: Publish approved v0.7.4 core
on:
  push:
    branches:
      - main
    paths:
      - release.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-advice-from-luminouspeace-v0.7.4
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'liviurachisanu-wq/advice-from-luminouspeace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify explicit approval and pinned legacy edition
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('release.json').read_text(encoding='utf-8'))
          assert data['version']=='0.7.4'
          assert data['status']=='released'
          assert data['content_review']['status']=='approved'
          assert data['content_review']['date']=='2026-11-25'
          assert data['edition']['tag']=='v0.7.2-ask-him.1'
          assert data['footnote']=='Influenced by the Advice from LuminousPeace skill — v0.7.4 · released 25 November 2026.'
          print('Approved core v0.7.4; existing Ask Him v0.7.2 pinned.')
          PY
      - name: Test exact final release sources and artifacts
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --check
          node --test tests/service.test.mjs
      - name: Tag verified main commit
        run: |
          if git show-ref --verify --quiet refs/tags/v0.7.4; then
            test "$(git rev-list -n 1 v0.7.4)" = "$(git rev-parse HEAD)"
          else
            git config user.name 'github-actions[bot]'
            git config user.email "$(printf '%s%s%s' '41898282+github-actions[bot]' '@' 'users.noreply.github.com')"
            git tag -a v0.7.4 -m 'Approved Advice from LuminousPeace v0.7.4'
          fi
          git push origin refs/tags/v0.7.4
      - name: Create GitHub draft from verified tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.7.4 >/dev/null 2>&1; then
            python scripts/draft_release.py
          fi
          gh release edit v0.7.4 --draft=false
      - name: Verify live release assets and published status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.7.4 --json tagName,isDraft,assets,url > /tmp/luminous-v074.json
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('/tmp/luminous-v074.json').read_text())
          assert data['tagName']=='v0.7.4' and data['isDraft'] is False
          names={a['name'] for a in data['assets']}
          expected={
              'advice-from-luminouspeace-claude-v0.7.4.zip',
              'chatgpt-project-instructions.txt',
              'copilot-agent-instructions.txt',
              'gemini-gem-instructions.txt',
              'portable-instructions.txt',
              'SHA256SUMS.txt'
          }
          assert names==expected, f'Unexpected release assets: {sorted(names^expected)}'
          assert 'advice-from-luminouspeace-ask-him.zip' not in names
          print('Verified published GitHub Release:',data['url'])
          print('Verified v0.7.4 core assets:',', '.join(sorted(names)))
          PY
