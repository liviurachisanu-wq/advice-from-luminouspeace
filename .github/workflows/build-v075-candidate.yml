name: Build v0.7.5 distribution candidate
# Retry with corrected link parser and valid published artifact link
on:
  push:
    branches:
      - review/v0.7.5-installation-reliability
    paths:
      - .github/workflows/build-v075-candidate.yml
permissions:
  contents: write
jobs:
  candidate:
    if: github.repository == 'liviurachisanu-wq/advice-from-luminouspeace' && github.ref == 'refs/heads/review/v0.7.5-installation-reliability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Build portable skill ZIPs and in-skill references
        run: |
          python scripts/build.py
          git rm -f --ignore-unmatch downloads/advice-from-luminouspeace-claude-v0.7.4.zip
      - name: Test complete candidate
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --check
          node --test tests/service.test.mjs
      - name: Commit only deterministic generated files to review branch
        run: |
          git add -- downloads index.html .github/skills/advice-from-luminouspeace/references
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email "$(printf '%s%s%s' '41898282+github-actions[bot]' '@' 'users.noreply.github.com')"
            git commit -m 'Build self-contained v0.7.5 installation candidate assets'
            git push origin HEAD:review/v0.7.5-installation-reliability
          fi
