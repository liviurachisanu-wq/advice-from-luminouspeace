name: Build approved v0.7.5-only distribution
on:
  push:
    branches:
      - release/v0.7.5-only
    paths:
      - .github/workflows/build-v075-release-assets.yml
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'liviurachisanu-wq/advice-from-luminouspeace' && github.ref == 'refs/heads/release/v0.7.5-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Rebuild exact release bytes
        run: python scripts/build.py
      - name: Verify tests, source integrity and reproducibility
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py --check
      - name: Commit generated files to review branch
        run: |
          git add -- downloads index.html .github/skills/advice-from-luminouspeace/references
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email "$(printf '%s%s%s' '41898282+github-actions[bot]' '@' 'users.noreply.github.com')"
            git commit -m 'Rebuild v0.7.5-only release artifacts'
            git push origin HEAD:release/v0.7.5-only
          fi
