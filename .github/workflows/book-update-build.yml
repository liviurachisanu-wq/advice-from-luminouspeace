name: Temporary book-update candidate build
on:
  push:
    branches:
      - books/nov-20-integrate-8-10
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Rebuild offline candidate artifacts
        run: |
          python scripts/build.py
          git rm -f --ignore-unmatch downloads/advice-from-luminouspeace-claude-v0.7.2.zip
          git add downloads/ skills/advice-from-luminouspeace/ index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate v0.7.3 candidate core downloads'
            git push origin HEAD:books/nov-20-integrate-8-10
          fi
